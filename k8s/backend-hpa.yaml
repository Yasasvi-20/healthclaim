apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mediclaim-backend-hpa
  namespace: mediclaim
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mediclaim-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
