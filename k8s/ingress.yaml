apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mediclaim-ingress
  namespace: mediclaim
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "mediclaim-ingress-ip"
    kubernetes.io/ingress.allow-http: "true"
    networking.gke.io/managed-certificates: "mediclaim-certificate"
    networking.gke.io/v1beta1.FrontendConfig: "mediclaim-https-redirect"
spec:
  rules:
    - host: mediclaim-portal.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
