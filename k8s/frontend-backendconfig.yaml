apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: mediclaim-frontend-health
  namespace: mediclaim
spec:
  healthCheck:
    type: HTTP
    requestPath: /
    port: 80
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 2
    unhealthyThreshold: 3
  connectionDraining:
    drainingTimeoutSec: 30
