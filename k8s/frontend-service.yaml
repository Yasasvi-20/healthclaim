apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mediclaim
  annotations:
    cloud.google.com/backend-config: '{"default":"mediclaim-frontend-health"}'
    cloud.google.com/neg: '{"ingress":true}'
spec:
  type: ClusterIP
  selector:
    app: mediclaim-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
