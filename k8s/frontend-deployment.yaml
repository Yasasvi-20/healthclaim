apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediclaim-frontend
  namespace: mediclaim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediclaim-frontend
  template:
    metadata:
      labels:
        app: mediclaim-frontend
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/mediclaim-509016/healthcare-claims/frontend:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
