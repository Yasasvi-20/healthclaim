apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediclaim-backend
  namespace: mediclaim
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mediclaim-backend
  template:
    metadata:
      labels:
        app: mediclaim-backend
    spec:
      serviceAccountName: mediclaim-backend
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/mediclaim-509016/healthcare-claims/backend:v4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CLOUD_MODE
              value: "true"
            - name: MYSQL_DATABASE
              value: healthcare_claims
            - name: GCS_BUCKET_NAME
              value: mediclaim-claims-509016
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
